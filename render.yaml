# Render Blueprint — BackEnd only (FrontEnd on Vercel, Admin optional local/Vercel)
# Set secrets in Dashboard: Aiven SPRING_DATASOURCE_*, Upstash REDIS_URL, CORS (see render.env.example, docs/aiven-mysql-setup.md)

services:
  - type: web
    name: engacademy-backend
    runtime: docker
    # Root Directory: repo root (empty). Do NOT set Dashboard rootDir to B or BackEnd.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    port: 10000
    healthCheckPath: /api/v1/auth/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: SERVER_PORT
        value: 10000
      - key: APPLICATION_SECURITY_JWT_SECRET_KEY
        generateValue: true
      - key: APPLICATION_SECURITY_JWT_EXPIRATION
        value: 86400000
      - key: APPLICATION_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION
        value: 604800000
      - key: APPLICATION_CORS_ALLOWED_ORIGINS
        sync: false
        # e.g. https://your-app.vercel.app,http://localhost:3000
      - key: REDIS_URL
        sync: false
        # Upstash: rediss://default:TOKEN@HOST:PORT
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none
      - key: APPLICATION_PROD_SEED_CURRICULUM_ENABLED
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "true"
      - key: RATE_LIMIT_MAX_ATTEMPTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
