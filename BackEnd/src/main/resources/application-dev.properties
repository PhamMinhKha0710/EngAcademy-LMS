# =================== Development Profile ===================
# Server, DB, JWT, CORS, mail: configure in BackEnd/.env (see .env.example).
# Profile: dev — enables DevDataSeeder for Swagger testing.

# JPA
spring.jpa.defer-datasource-initialization=true

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Redis — disabled by default in local dev (enable in .env if Redis is running)
spring.data.redis.enabled=false

# Rate Limiting
rate-limit.max-attempts=100
rate-limit.window-seconds=60
rate-limit.enabled=true

# Flyway Migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SQL Initialization
spring.sql.init.mode=never

# DevTools
spring.devtools.restart.enabled=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
