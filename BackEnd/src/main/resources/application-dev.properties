# =================== Development Profile ===================
# Server, DB, JWT, CORS, mail: configure in BackEnd/.env (see .env.example).
# Profile: dev — enables DevDataSeeder for Swagger testing.

# JPA
spring.jpa.defer-datasource-initialization=true

# HikariCP Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.tomcat.threads.max=400
server.tomcat.accept-count=200

application.websocket.max-connections-per-user=10

# Rate Limiting
rate-limit.max-attempts=100
rate-limit.window-seconds=60
rate-limit.enabled=true
rate-limit.trust-proxy-headers=false

# Dev-only: Swagger + documented seed accounts (Docs/06-Test-Accounts.md)
application.security.swagger.enabled=true
application.security.seed-login.enabled=true

# JWT blacklist / refresh rotation needs Redis — enable for full auth security testing
spring.data.redis.enabled=true

# Flyway Migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SQL Initialization
spring.sql.init.mode=never

# DevTools
spring.devtools.restart.enabled=false

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
