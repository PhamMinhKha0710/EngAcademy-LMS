# Production profile — EngAcademy LMS
# Activate: spring.profiles.active=prod
# Requires: REDIS_URL, SPRING_DATASOURCE_* (see ProductionProfileEnvironmentListener)

# Security (SEC-HIGH-001)
application.security.swagger.enabled=false
application.security.seed-login.enabled=false

# Rate limit behind reverse proxy (SEC-HIGH-004)
rate-limit.trust-proxy-headers=true
rate-limit.max-attempts=10
rate-limit.window-seconds=60

# Exam schedule
application.exam.schedule-zone=Asia/Ho_Chi_Minh

# Flyway on prod if used
spring.flyway.enabled=false

# Free-tier Render (512MB): lazy beans + smaller pools/threads for faster startup and less RAM
spring.main.lazy-initialization=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false

# Redis (Upstash) — REDIS_URL required in prod (see ProductionProfileEnvironmentListener)
spring.data.redis.url=${REDIS_URL}

# MySQL (Aiven) — SPRING_DATASOURCE_* required in prod (see ProductionProfileEnvironmentListener)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool — free Render 512MB: keep pool small (override via env if needed)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

server.tomcat.threads.max=50
server.tomcat.accept-count=50
server.tomcat.max-connections=200

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

application.websocket.max-connections-per-user=5
