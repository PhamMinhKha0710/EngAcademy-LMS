# Performance / load-test profile (inherits dev DB, tuned for throughput measurement)
# Activate: spring.profiles.active=dev,perf  OR  dev + include perf via spring.config.import

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000

server.tomcat.threads.max=400
server.tomcat.accept-count=200
server.tomcat.max-connections=10000

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

application.websocket.max-connections-per-user=5
