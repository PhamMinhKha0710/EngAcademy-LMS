[build]
  builder = "DOCKERFILE"

[deploy]
  # Railway uses Dockerfile ENTRYPOINT which bakes in SPRING_PROFILES_ACTIVE + datasource env vars.
  # Do NOT set startCommand here — it would override Dockerfile ENTRYPOINT.
  healthcheckPath = "/api/v1/auth/health"
  healthcheckInterval = 60
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
